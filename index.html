<!DOCTYPE html>
<html lang="nl">
<head><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mena Muria Klok, Radio, Wekker & Kalender</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MM Klok">
  <meta name="theme-color" content="#0f0d0b">

  <link rel="manifest" href='data:application/manifest+json,{"name":"Mena Muria Klok","short_name":"MM Klok","start_url":".","display":"standalone","background_color":"#0f0d0b","theme_color":"#0f0d0b","orientation":"portrait"}'>

  <style>
    :root {
      --bg-color: #0f0d0b;
      --gold-light: #f5d77f;
      --gold-mid: #c89d2a;
      --gold-dark: #826211;
      --rms-blue: #0033a0;
      --rms-white: #ffffff;
      --rms-green: #007a33;
      --rms-red: #d52b1e;
      --card-bg: #14100c;
      --border-color: #4a3822;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--gold-light);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

      
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Eeuwkalender</title>
    <style>
        body {
            background-color: #0b0804;
            color: #d4af37;
            font-family: 'Times New Roman', serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            background: #110d06;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        /* Analoge Klok Styling */
        .clock-box {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto;
            background: radial-gradient(circle, #2a1f10 0%, #0d0904 100%);
            border: 3px solid #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background: #d4af37;
            border-radius: 4px;
        }
        .hour-hand { width: 4px; height: 60px; background: #f3e5ab; margin-left: -2px; }
        .minute-hand { width: 3px; height: 85px; background: #d4af37; margin-left: -1.5px; }
        .second-hand { width: 1px; height: 95px; background: #ff4444; margin-left: -0.5px; }
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: #8b0000;
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: -7px 0 0 -7px;
        }
        <style>
    :root {
      --bg-color: #0f0d0b;
      --gold-light: #f5d77f;
      --gold-mid: #c89d2a;
      --gold-dark: #826211;
      --rms-blue: #0033a0;
      --rms-white: #ffffff;
      --rms-green: #007a33;
      --rms-red: #d52b1e;
      --card-bg: #14100c;
      --border-color: #4a3822;
    }

        .section-box {
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: #0f0a05;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        select, input[type="text"], input[type="number"], button {
            background-color: #1a1205;
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            margin: 4px 0;
            box-sizing: border-box;
        }
        select, input[type="text"] {
            width: 100%;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #0b0804;
        }
        button:hover {
            opacity: 0.9;
        }
        #mediaOutput {
            margin-top: 10px;
        }
        iframe {
            border-radius: 6px;
            border: 1px solid #d4af37;
            width: 100%;
            height: 180px;
        }
        .status-text {
            font-size: 11px;
            font-style: italic;
            margin-top: 5px;
            color: #c5a059;
        }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            font-size: 12px;
            text-align: center;
        }
        th {
            color: #f3e5ab;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MENA MURIA</h1>
    <div class="subtitle">KLOK • RADIO STREAM • EEUWKALENDER</div>

    <!-- Analoge Klok Sectie -->
    <div class="section-box">
        <div class="clock-box">
            <!-- Wijzers voor de analoge klok -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>
        <div class="section-title" style="margin-top: 10px;">ABORU</div>
        <div class="status-text" id="digitalDateDisplay">dinsdag 13 oktober 2026 - 18:27:47</div>
    </div>

    <!-- Stream & Speler Sectie -->
    <div class="section-box">
        <div class="section-title">📻 STREAM & RADIO SPELER</div>
        
        <select id="stationSelect">
            <option value="https://youtu.be/ocdYHHrBrkg">YouTube Stream (Hita Ambon)</option>
            <option value="https://icecast.omroep.nl/radio1-bb-mp3">Radio 1 (Audio)</option>
        </select>

        <input type="text" id="mediaUrl" value="https://youtu.be/ocdYHHrBrkg" placeholder="Plak YouTube of Stream URL hier..." />
        
        <div style="display: flex; gap: 5px;">
            <button id="playBtn" style="flex: 1;">▶ Play</button>
            <button id="stopBtn" style="flex: 1;">⏹ Stop</button>
        </div>

        <div id="mediaOutput">
            <div class="status-text" id="playerStatus">Speler gereed</div>
        </div>
    </div>

    <!-- Eeuwkalender Sectie -->
    <div class="section-box">
        <div class="section-title">📅 EEUWKALENDER</div>
        <div style="display: flex; gap: 5px; justify-content: center; margin-bottom: 8px;">
            <button id="todayBtn">Vandaag</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <select id="monthSelect" style="flex: 2;">
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Maart</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">Augustus</option>
                <option value="8">September</option>
                <option value="9" selected>Oktober</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <input type="number" id="yearInput" value="2026" style="flex: 1; text-align: center;" />
        </div>
        <button id="goToYearBtn" style="width: 100%; margin-top: 5px;">Ga naar jaar</button>
        
        <!-- Kalenderweergave -->
        <div id="calendarContainer" style="margin-top: 10px;">
            <div style="font-size: 13px; font-weight: bold; color: #f3e5ab;" id="calMonthYearTitle">Oktober 2026</div>
            <table>
                <thead>
                    <tr>
                        <th style="color: #f3e5ab;">Ma</th>
                        <th>Di</th>
                        <th>Wo</th>
                        <th>Do</th>
                        <th>Vr</th>
                        <th style="color: #ff9999;">Za</th>
                        <th style="color: #ff9999;">Zo</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Wordt dynamisch gevuld -->
                </tbody>
            </table>
        </div>
        
        <div class="status-text" id="selectedDateInfo" style="margin-top: 10px; border-top: 1px dashed #d4af37; padding-top: 5px;">
            Geselecteerde datum: Dinsdag 13 Oktober 2026
        </div>
    </div>

</div>

<script>
    // Synchroniseer dropdown met invoerveld
    document.getElementById('stationSelect').addEventListener('change', function() {
        document.getElementById('mediaUrl').value = this.value;
    });

    // Play knop functionaliteit met automatische YouTube check
    document.getElementById('playBtn').addEventListener('click', function() {
        const urlInput = document.getElementById('mediaUrl').value.trim();
        const outputDiv = document.getElementById('mediaOutput');
        
        if (!urlInput) {
            outputDiv.innerHTML = `<div class="status-text" style="color:red;">Voer eerst een link in</div>`;
            return;
        }

        if (urlInput.includes("youtube.com") || urlInput.includes("youtu.be")) {
            let videoId = "";
            if (urlInput.includes("youtu.be/")) {
                videoId = urlInput.split("youtu.be/")[1].split("?")[0];
            } else if (urlInput.includes("watch?v=")) {
                videoId = urlInput.split("watch?v=")[1].split("&")[0];
            }
            
            if (videoId) {
                outputDiv.innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                    <div class="status-text">Live videostream actief</div>
                `;
            } else {
                outputDiv.innerHTML = `<div class="status-text" style="color:red;">Kon YouTube ID niet vinden</div>`;
            }
        } else {
            outputDiv.innerHTML = `
                <audio id="audioStream" controls autoplay style="width:100%; margin-top:5px;">
                    <source src="${urlInput}" type="audio/mpeg">
                    Je browser ondersteunt geen audio.
                </audio>
                <div class="status-text">Audio speler actief</div>
            `;
        }
    });

    // Stop knop
    document.getElementById('stopBtn').addEventListener('click', function() {
        const outputDiv = document.getElementById('mediaOutput');
        outputDiv.innerHTML = `<div class="status-text" id="playerStatus">Speler gestopt</div>`;
    });

    // Analoge klok en datum updaten
    function updateClock() {
        const now = new Date();
        
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondDeg = seconds * 6;
        const minuteDeg = minutes * 6 + seconds * 0.1;
        const hourDeg = (hours % 12) * 30 + minutes * 0.5;

        document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
        document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
        document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;

        // Datum tekst onder klok
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('digitalDateDisplay').innerText = now.toLocaleDateString('nl-NL', options) + ' - ' + now.toLocaleTimeString('nl-NL');
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Eenvoudige kalender generator
    function generateCalendar(year, month) {
        const body = document.getElementById('calendarBody');
        body.innerHTML = '';
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        
        let startDay = firstDay.getDay() - 1;
        if (startDay === -1) startDay = 6;
        
        let date = 1;
        let html = '';
        
        for (let i = 0; i < 6; i++) {
            let row = '<tr>';
            for (let j = 0; j < 7; j++) {
                if (i === 0 && j < startDay) {
                    row += '<td></td>';
                } else if (date > lastDay.getDate()) {
                    row += '<td></td>';
                } else {
                    let isToday = (date === 13 && month === 9 && year === 2026);
                    let style = isToday ? 'background: #d4af37; color: #0b0804; font-weight: bold; border-radius: 50%;' : '';
                    row += `<td style="${style}">${date}</td>`;
                    date++;
                }
            }
            row += '</tr>';
            html += row;
            if (date > lastDay.getDate()) break;
        }
        body.innerHTML = html;
    }

    generateCalendar(2026, 9);
</script>

<script>
    // Synchroniseer de zender-selectie met het invoerveld
    const stationSelect = document.getElementById('stationSelect');
    if (stationSelect) {
        stationSelect.addEventListener('change', function() {
            document.getElementById('mediaUrl').value = this.value;
        });
    }

    // Play knop functionaliteit
    document.getElementById('playBtn').addEventListener('click', function() {
        const urlInput = document.getElementById('mediaUrl').value.trim();
        let outputDiv = document.getElementById('mediaOutput');
        
        // Als mediaOutput nog niet bestaat in je HTML, maken we deze dynamisch aan
        if (!outputDiv) {
            outputDiv = document.createElement('div');
            outputDiv.id = 'mediaOutput';
            document.getElementById('mediaUrl').parentNode.appendChild(outputDiv);
        }

        if (!urlInput) {
            outputDiv.innerHTML = `<div style="font-size:11px; font-style:italic; color:red; margin-top:5px;">Voer een URL in</div>`;
            return;
        }

        // Controleer op YouTube links (behandelt direct youtu.be/ en youtube.com/)
        if (urlInput.includes("youtube.com") || urlInput.includes("youtu.be")) {
            let videoId = "";
            
            if (urlInput.includes("youtu.be/")) {
                videoId = urlInput.split("youtu.be/")[1].split("?")[0].split("&")[0];
            } else if (urlInput.includes("watch?v=")) {
                videoId = urlInput.split("watch?v=")[1].split("&")[0];
            }
            
            if (videoId) {
                outputDiv.innerHTML = `
                    <div style="margin-top:10px;">
                        <iframe width="100%" height="180" 
                            src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen 
                            style="border: 1px solid #d4af37; border-radius: 6px;">
                        </iframe>
                        <div style="font-size:11px; font-style:italic; color:#c5a059; margin-top:5px;">Live videostream actief</div>
                    </div>
                `;
            } else {
                outputDiv.innerHTML = `<div style="font-size:11px; font-style:italic; color:red; margin-top:5px;">Kon YouTube video-ID niet laden</div>`;
            }
        } else {
            // Behandel overige links als een audiostream/radiostream
            outputDiv.innerHTML = `
                <div style="margin-top:10px;">
                    <audio id="audioStream" controls autoplay style="width:100%;">
                        <source src="${urlInput}" type="audio/mpeg">
                        Je browser ondersteunt dit audio-element niet.
                    </audio>
                    <div style="font-size:11px; font-style:italic; color:#c5a059; margin-top:5px;">Audiostream actief</div>
                </div>
            `;
        }
    });

    // Stop knop functionaliteit
    document.getElementById('stopBtn').addEventListener('click', function() {
        let outputDiv = document.getElementById('mediaOutput');
        if (outputDiv) {
            outputDiv.innerHTML = `<div style="font-size:11px; font-style:italic; color:#c5a059; margin-top:5px;">Speler gestopt</div>`;
        }
    });
</script>

</body>
</html>
