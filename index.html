<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Eeuwkalender</title>
    <style>
        body {
            background-color: #0b0804;
            color: #d4af37;
            font-family: 'Times New Roman', serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            background: #110d06;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        .section-box {
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: #0f0a05;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* RMS ANALOGE KLOK STYLING */
        .clock-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 10px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #2a1f10 0%, #0d0904 100%);
            border: 4px solid #d4af37;
            box-shadow: inset 0 0 15px #000, 0 0 12px rgba(212, 175, 55, 0.4);
        }

        /* Cijfers op de klok */
        .clock-number {
            position: absolute;
            font-weight: bold;
            font-size: 16px;
            color: #f3e5ab;
            text-shadow: 1px 1px 2px #000;
            transform: translate(-50%, -50%);
        }

        /* Teksten en RMS Logo op het klokoppervlak */
        .clock-face-details {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .text-top {
            position: absolute;
            top: 50px;
            font-size: 10px;
            letter-spacing: 1px;
            color: #f3e5ab;
            font-weight: bold;
        }
        .text-mena {
            position: absolute;
            top: 65px;
            font-size: 14px;
            font-weight: bold;
            color: #f3e5ab;
            letter-spacing: 2px;
        }
        
        /* RMS Vlag met Vleugels Embleem */
        .rms-emblem {
            position: absolute;
            top: 92px;
            width: 140px;
            height: 40px;
        }
        
        .text-numbers {
            position: absolute;
            top: 135px;
            width: 130px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            color: #f3e5ab;
        }
        .text-muria {
            position: absolute;
            top: 155px;
            font-size: 13px;
            font-weight: bold;
            color: #f3e5ab;
            letter-spacing: 2px;
        }
        .text-date {
            position: absolute;
            top: 173px;
            font-size: 9px;
            color: #c5a059;
            letter-spacing: 1px;
        }

        /* Wijzers */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background: #d4af37;
            border-radius: 4px;
            z-index: 10;
        }
        .hour-hand { width: 4px; height: 55px; background: #f3e5ab; margin-left: -2px; }
        .minute-hand { width: 3px; height: 80px; background: #d4af37; margin-left: -1.5px; }
        .second-hand { width: 1px; height: 90px; background: #ff3333; margin-left: -0.5px; z-index: 11; }
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            background: radial-gradient(circle, #aa0000 0%, #550000 100%);
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: -8px 0 0 -8px;
            z-index: 12;
        }

        /* Formulieren & Knoppen */
        select, input[type="text"], input[type="number"], button {
            background-color: #1a1205;
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            margin: 4px 0;
            box-sizing: border-box;
        }
        select, input[type="text"] { width: 100%; }
        button {
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #0b0804;
        }
        button:hover { opacity: 0.9; }

        iframe {
            border-radius: 6px;
            border: 1px solid #d4af37;
            width: 100%;
            height: 180px;
        }
        .status-text {
            font-size: 11px;
            font-style: italic;
            margin-top: 5px;
            color: #c5a059;
        }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            font-size: 12px;
            text-align: center;
        }
        th { color: #f3e5ab; }
    </style>
</head>
<body>

<div class="container">
    <h1>MENA MURIA</h1>
    <div class="subtitle">KLOK • RADIO STREAM • EEUWKALENDER</div>

    <!-- ANALOGE RMS KLOK -->
    <div class="section-box">
        <div class="clock-container">
            <!-- Cijfers 1 t/m 12 -->
            <div class="clock-number" style="top: 10%; left: 50%;">12</div>
            <div class="clock-number" style="top: 15%; left: 71%;">1</div>
            <div class="clock-number" style="top: 29%; left: 86%;">2</div>
            <div class="clock-number" style="top: 50%; left: 91%;">3</div>
            <div class="clock-number" style="top: 71%; left: 86%;">4</div>
            <div class="clock-number" style="top: 85%; left: 71%;">5</div>
            <div class="clock-number" style="top: 90%; left: 50%;">6</div>
            <div class="clock-number" style="top: 85%; left: 29%;">7</div>
            <div class="clock-number" style="top: 71%; left: 14%;">8</div>
            <div class="clock-number" style="top: 50%; left: 9%;">9</div>
            <div class="clock-number" style="top: 29%; left: 14%;">10</div>
            <div class="clock-number" style="top: 15%; left: 29%;">11</div>

            <!-- Teksten & RMS Vlag / Embleem op de Klok -->
            <div class="clock-face-details">
                <div class="text-top">LEA LOHI SAMASURU</div>
                <div class="text-mena">★ MENA ★</div>
                
                <!-- SVG RMS Vlag Vleugels Embleem -->
                <svg class="rms-emblem" viewBox="0 0 140 40">
                    <!-- Linkervleugel (Blauw, Wit, Groen, Rood) -->
                    <path d="M 10 20 Q 35 10 65 20 Q 35 25 10 20 Z" fill="#0033aa"/>
                    <path d="M 12 23 Q 35 15 65 20 Q 35 28 12 23 Z" fill="#ffffff"/>
                    <path d="M 14 26 Q 35 20 65 20 Q 35 31 14 26 Z" fill="#008800"/>
                    <path d="M 16 29 Q 35 25 65 20 Q 35 34 16 29 Z" fill="#cc0000"/>
                    
                    <!-- Rechtervleugel (Blauw, Wit, Groen, Rood) -->
                    <path d="M 130 20 Q 105 10 75 20 Q 105 25 130 20 Z" fill="#0033aa"/>
                    <path d="M 128 23 Q 105 15 75 20 Q 105 28 128 23 Z" fill="#ffffff"/>
                    <path d="M 126 26 Q 105 20 75 20 Q 105 31 126 26 Z" fill="#008800"/>
                    <path d="M 124 29 Q 105 25 75 20 Q 105 34 124 29 Z" fill="#cc0000"/>
                </svg>

                <div class="text-numbers">
                    <span>25</span>
                    <span>04</span>
                </div>
                <div class="text-muria">MURIA</div>
                <div class="text-date">25-04-1950</div>
            </div>

            <!-- Wijzers -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>

        <div style="font-size: 16px; font-weight: bold; letter-spacing: 2px; margin-top: 8px;">ABORU</div>
        <div class="status-text" id="digitalDateDisplay">dinsdag 13 oktober 2026 - 12:11:09</div>
    </div>

    <!-- STREAM & RADIO SPELER SECTIE -->
    <div class="section-box">
        <div class="section-title">📻 STREAM PLAYER</div>
        
        <select id="stationSelect">
            <option value="https://youtu.be/TEhNMG2du8k">YouTube Stream (Voorbeeld)</option>
            <option value="https://icecast.omroep.nl/radio1-bb-mp3">Radio 1 (Audio)</option>
        </select>

        <input type="text" id="mediaUrl" value="https://youtu.be/TEhNMG2du8k" placeholder="Plak YouTube of Stream URL..." />
        
        <div style="display: flex; gap: 5px;">
            <button id="playBtn" style="flex: 1;">▶ Play</button>
            <button id="stopBtn" style="flex: 1;">⏹ Stop</button>
        </div>

        <div id="mediaOutput">
            <div class="status-text" id="playerStatus">Speler gereed</div>
        </div>
    </div>

    <!-- EEUWKALENDER SECTIE -->
    <div class="section-box">
        <div class="section-title">📅 EEUWKALENDER</div>
        <div style="display: flex; gap: 5px; justify-content: center; margin-bottom: 8px;">
            <button id="todayBtn">Vandaag</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <select id="monthSelect" style="flex: 2;">
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Maart</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">Augustus</option>
                <option value="8">September</option>
                <option value="9" selected>Oktober</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <input type="number" id="yearInput" value="2026" style="flex: 1; text-align: center;" />
        </div>
        <button id="goToYearBtn" style="width: 100%; margin-top: 5px;">Ga naar jaar</button>
        
        <div id="calendarContainer" style="margin-top: 10px;">
            <div style="font-size: 13px; font-weight: bold; color: #f3e5ab;" id="calMonthYearTitle">Oktober 2026</div>
            <table>
                <thead>
                    <tr>
                        <th style="color: #f3e5ab;">Ma</th>
                        <th>Di</th>
                        <th>Wo</th>
                        <th>Do</th>
                        <th>Vr</th>
                        <th style="color: #ff9999;">Za</th>
                        <th style="color: #ff9999;">Zo</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Kalender dagen -->
                </tbody>
            </table>
        </div>
        
        <div class="status-text" id="selectedDateInfo" style="margin-top: 10px; border-top: 1px dashed #d4af37; padding-top: 5px;">
            Geselecteerde datum: Dinsdag 13 Oktober 2026
        </div>
    </div>

</div>

<script>
    // 1. Klok en Datum Logica
    function updateClock() {
        const now = new Date();
        const seconds = now.getSeconds();
        const minutes = now.getMinutes();
        const hours = now.getHours();

        const secondDeg = seconds * 6;
        const minuteDeg = minutes * 6 + seconds * 0.1;
        const hourDeg = (hours % 12) * 30 + minutes * 0.5;

        document.getElementById('secondHand').style.transform = `rotate(${secondDeg}deg)`;
        document.getElementById('minuteHand').style.transform = `rotate(${minuteDeg}deg)`;
        document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('digitalDateDisplay').innerText = now.toLocaleDateString('nl-NL', options) + ' - ' + now.toLocaleTimeString('nl-NL');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Stream & Video Player Logica
    document.getElementById('stationSelect').addEventListener('change', function() {
        document.getElementById('mediaUrl').value = this.value;
    });

    document.getElementById('playBtn').addEventListener('click', function() {
        const urlInput = document.getElementById('mediaUrl').value.trim();
        const outputDiv = document.getElementById('mediaOutput');
        
        if (!urlInput) {
            outputDiv.innerHTML = `<div class="status-text" style="color:red;">Voer een URL in</div>`;
            return;
        }

        // Automatische omzetting van YouTube-links (youtu.be / youtube.com)
        if (urlInput.includes("youtube.com") || urlInput.includes("youtu.be")) {
            let videoId = "";
            if (urlInput.includes("youtu.be/")) {
                videoId = urlInput.split("youtu.be/")[1].split("?")[0].split("&")[0];
            } else if (urlInput.includes("watch?v=")) {
                videoId = urlInput.split("watch?v=")[1].split("&")[0];
            }
            
            if (videoId) {
                outputDiv.innerHTML = `
                    <div style="margin-top:10px;">
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                        <div class="status-text">Live videostream actief</div>
                    </div>
                `;
            } else {
                outputDiv.innerHTML = `<div class="status-text" style="color:red;">Kon YouTube ID niet verwerken</div>`;
            }
        } else {
            // Radio/Audio player
            outputDiv.innerHTML = `
                <div style="margin-top:10px;">
                    <audio id="audioStream" controls autoplay style="width:100%;">
                        <source src="${urlInput}" type="audio/mpeg">
                        Browser ondersteunt dit audio-element niet.
                    </audio>
                    <div class="status-text">Audiostream actief</div>
                </div>
            `;
        }
    });

    document.getElementById('stopBtn').addEventListener('click', function() {
        document.getElementById('mediaOutput').innerHTML = `<div class="status-text">Speler gestopt</div>`;
    });

    // 3. Kalender Logica
    function generateCalendar(year, month) {
        const body = document.getElementById('calendarBody');
        body.innerHTML = '';
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        
        let startDay = firstDay.getDay() - 1;
        if (startDay === -1) startDay = 6;
        
        let date = 1;
        let html = '';
        
        for (let i = 0; i < 6; i++) {
            let row = '<tr>';
            for (let j = 0; j < 7; j++) {
                if (i === 0 && j < startDay) {
                    row += '<td></td>';
                } else if (date > lastDay.getDate()) {
                    row += '<td></td>';
                } else {
                    let isToday = (date === 13 && month === 9 && year === 2026);
                    let style = isToday ? 'background: #d4af37; color: #0b0804; font-weight: bold; border-radius: 50%;' : '';
                    row += `<td style="${style}">${date}</td>`;
                    date++;
                }
            }
            row += '</tr>';
            html += row;
            if (date > lastDay.getDate()) break;
        }
        body.innerHTML = html;
    }
    generateCalendar(2026, 9);
</script>

</body>
</html>
